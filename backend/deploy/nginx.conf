# /etc/nginx/sites-available/resqmesh
# After copying: sudo ln -s /etc/nginx/sites-available/resqmesh /etc/nginx/sites-enabled/
# then: sudo nginx -t && sudo systemctl reload nginx
# Run certbot AFTER this config is enabled — it edits this file in place to add the TLS block.

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_SSLIP_HOST;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Required for the /ws/notifications WebSocket endpoint
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 75s;
    }
}
